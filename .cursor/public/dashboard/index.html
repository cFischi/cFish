<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Monitor Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment"></script>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">Resource Monitor Dashboard</h1>

    <!-- Current Metrics -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold mb-4">CPU Usage</h2>
        <div class="text-4xl font-bold text-blue-600" id="cpu-usage">0%</div>
        <div class="mt-2 text-sm text-gray-500" id="cpu-status">Normal</div>
      </div>

      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold mb-4">Memory Usage</h2>
        <div class="text-4xl font-bold text-green-600" id="memory-usage">0%</div>
        <div class="mt-2 text-sm text-gray-500" id="memory-status">Normal</div>
      </div>

      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold mb-4">Disk Usage</h2>
        <div class="text-4xl font-bold text-purple-600" id="disk-usage">0%</div>
        <div class="mt-2 text-sm text-gray-500" id="disk-status">Normal</div>
      </div>
    </div>

    <!-- Historical Charts -->
    <div class="grid grid-cols-1 gap-6 mb-8">
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold mb-4">Resource Usage History</h2>
        <canvas id="history-chart"></canvas>
      </div>
    </div>

    <!-- Alerts -->
    <div class="bg-white rounded-lg shadow p-6">
      <h2 class="text-xl font-semibold mb-4">Recent Alerts</h2>
      <div class="overflow-y-auto max-h-64" id="alerts-container">
        <!-- Alerts will be inserted here -->
      </div>
    </div>
  </div>

  <script>
    // Initialize WebSocket connection
    const ws = new WebSocket(`ws://${window.location.host}`);
    let historyChart;

    // Initialize Chart.js
    function initializeChart() {
      const ctx = document.getElementById('history-chart').getContext('2d');
      historyChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            {
              label: 'CPU Usage',
              borderColor: 'rgb(59, 130, 246)',
              data: []
            },
            {
              label: 'Memory Usage',
              borderColor: 'rgb(34, 197, 94)',
              data: []
            },
            {
              label: 'Disk Usage',
              borderColor: 'rgb(147, 51, 234)',
              data: []
            }
          ]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
              max: 100
            }
          }
        }
      });
    }

    // Update metrics display
    function updateMetrics(metrics) {
      // Update current values
      document.getElementById('cpu-usage').textContent = 
        `${metrics.resourceStats.resourceMetrics.cpu.toFixed(1)}%`;
      document.getElementById('memory-usage').textContent = 
        `${metrics.resourceStats.resourceMetrics.memory.toFixed(1)}%`;
      document.getElementById('disk-usage').textContent = 
        `${metrics.resourceStats.resourceMetrics.disk.toFixed(1)}%`;

      // Update status indicators
      updateStatus('cpu', metrics.resourceStats.resourceMetrics.cpu);
      updateStatus('memory', metrics.resourceStats.resourceMetrics.memory);
      updateStatus('disk', metrics.resourceStats.resourceMetrics.disk);

      // Update chart
      if (historyChart) {
        const timestamp = moment().format('HH:mm:ss');
        historyChart.data.labels.push(timestamp);
        historyChart.data.datasets[0].data.push(metrics.resourceStats.resourceMetrics.cpu);
        historyChart.data.datasets[1].data.push(metrics.resourceStats.resourceMetrics.memory);
        historyChart.data.datasets[2].data.push(metrics.resourceStats.resourceMetrics.disk);

        // Keep last 50 points
        if (historyChart.data.labels.length > 50) {
          historyChart.data.labels.shift();
          historyChart.data.datasets.forEach(dataset => dataset.data.shift());
        }

        historyChart.update();
      }
    }

    // Update status indicators
    function updateStatus(resource, value) {
      const element = document.getElementById(`${resource}-status`);
      let status = 'Normal';
      let color = 'text-gray-500';

      if (value >= 80) {
        status = 'Critical';
        color = 'text-red-500';
      } else if (value >= 70) {
        status = 'Warning';
        color = 'text-yellow-500';
      }

      element.textContent = status;
      element.className = `mt-2 text-sm ${color}`;
    }

    // Add alert to the dashboard
    function addAlert(alert) {
      const alertsContainer = document.getElementById('alerts-container');
      const alertElement = document.createElement('div');
      
      const severity = alert.type === 'critical' ? 'text-red-600' : 'text-yellow-600';
      const timestamp = moment(alert.timestamp).format('HH:mm:ss');

      alertElement.className = `p-4 mb-2 border-l-4 border-${severity} bg-${severity}-50`;
      alertElement.innerHTML = `
        <div class="flex justify-between">
          <span class="${severity} font-semibold">${alert.type.toUpperCase()}</span>
          <span class="text-gray-500">${timestamp}</span>
        </div>
        <p class="mt-1">${alert.message}</p>
      `;

      alertsContainer.insertBefore(alertElement, alertsContainer.firstChild);

      // Keep only last 10 visible alerts
      while (alertsContainer.children.length > 10) {
        alertsContainer.removeChild(alertsContainer.lastChild);
      }
    }

    // WebSocket event handlers
    ws.onopen = () => {
      console.log('Connected to dashboard server');
      initializeChart();
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      
      switch (data.type) {
        case 'init':
          // Initialize dashboard with current state
          updateMetrics(data.data.current);
          data.data.alerts.forEach(addAlert);
          break;
        
        case 'update':
          // Update metrics
          updateMetrics(data.data);
          break;
        
        case 'alert':
          // Add new alert
          addAlert(data.data);
          break;
      }
    };

    ws.onerror = (error) => {
      console.error('WebSocket error:', error);
    };

    ws.onclose = () => {
      console.log('Disconnected from dashboard server');
    };
  </script>
</body>
</html>
